# Builds the static demo (VITE_STATIC_DEMO, API runs in the browser) and
# publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package.json pins the macOS x64 native bindings for local installs;
      # drop them here so npm picks the Linux ones from the lockfile instead.
      - name: Install dependencies
        run: |
          npm pkg delete 'devDependencies.@rolldown/binding-darwin-x64' 'devDependencies.@oxlint/binding-darwin-x64'
          npm install --no-audit --no-fund

      - name: Build static demo
        run: npm run build:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
